{% extends 'base.html' %}

{% block content %}

    <div>
        <a class="w-100 btn btn-primary bi-pencil-square" href="{% url 'create' %}"> Create New Task </a>
        <hr>
    </div>

    {% for task in tasks %}
        <div>
            <h2>{{ task.title }}</h2>
            <p>{{ task.complete }}</p>

        </br>

        <div class="align-right">
            <span class="buttons">
            <a class="btn btn-sm btn-primary bi-eye" href="{% url 'detail' task.id %}"> View Details </a>
            <a class="btn btn-sm btn-info bi-pencil-square" href="{% url 'update' task.id %}"> Update Task </a>
            </span>
        </br>
        <hr>
        </div>
        </div>
       
    {% endfor %}
    
{% endblock content %}
