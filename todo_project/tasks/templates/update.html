{% extends 'base.html' %}

{% block content %}

    <div>
        <h3 class="h-left" >Update Task</h3>
        <h3 class="h-right" > ID: {{ form.instance.id }}</h3>
    </br>
    </br>
    <hr>
    </div>


    <form method="POST" action="">
        {% csrf_token %}
        <p> <b> Title: </b> {{ form.title }} </p>
        <p> <b> Complete: </b> {{ form.complete }} </p>
    </br>
</br>
<input class="btn btn-success" type="submit" value="Update ToDo">
<a class="w-100 btn btn-info" href="{% url 'home' %}">Cancel</a>
    </form>

{% endblock %}
